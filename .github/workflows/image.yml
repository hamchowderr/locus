# Builds the agent server's Docker image (apps/agent/Dockerfile) here instead of on the server that runs it
# (release/README.md). Two Coolify apps deploy it: locus-agent and locus-agent-staging. A pull request only builds the
# image; main also publishes it to GHCR (private) and moves the release branch, which Coolify deploys from, so the
# server only downloads an image that already exists.
name: Image

on:
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

concurrency:
  # A pull request's runs share a group and the newest cancels the rest. Every other run (a main push, a re-run, a
  # manual run) gets its own group, so none can cancel another's publish; the fast-forward-only release push below
  # decides which commit the release branch ends on.
  group: image-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/locus-agent
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history, so the release push below can fast-forward the release branch to this commit.
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/agent/Dockerfile
          load: true
          tags: locus-agent:check
          cache-from: type=gha,scope=locus-agent
          cache-to: type=gha,scope=locus-agent,mode=max
      - name: Image size
        run: docker image inspect locus-agent:check --format '{{.Size}}' | awk '{ printf "%.0f MB\n", $1 / 1000000 }'
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/agent/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=locus-agent
      # Coolify deploys from this branch (release/locus-agent.Dockerfile), so it only ever picks up a commit whose image
      # is already published. The push is never forced: GitHub accepts it only when it moves the branch forward, so a
      # re-run of an older commit cannot roll the apps back, and a later commit (docs-only or not) never blocks one.
      - name: Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          BRANCH: release/locus-agent
        run: |
          if out=$(git push origin "HEAD:refs/heads/$BRANCH" 2>&1); then echo "$out"; exit 0; fi
          echo "$out"
          if grep -qE 'non-fast-forward' <<<"$out"; then echo "$BRANCH already holds a newer commit; leaving it there"; exit 0; fi
          exit 1
